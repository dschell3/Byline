# SCRUM-73: Render Blueprint for Byline.
#
# Everything the app needs to run is declared here, so the services can be
# recreated in any Render account from this repository rather than rebuilt by
# hand in the dashboard. That is the whole point: when the production account
# is opened in The Emerson Empire's name, it points at this file and gets an
# identical stack.
#
# SCRUM-75: the stack now runs on paid plans in The Emerson Empire's own
# Render account, billed to the client (charter section 2.4):
#   byline-db   basic-256mb  ($6/month)  never deleted, unlike the free plan
#   byline-api  starter      ($7/month)  never sleeps, so no 1-minute wake-up
#   byline-web  static site  (free)

databases:
  - name: byline-db
    databaseName: byline
    user: byline
    plan: basic-256mb
    region: oregon

services:
  # --- Python API -----------------------------------------------------------
  - type: web
    name: byline-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # Migrations run on boot. Alembic records applied revisions, so this is
    # idempotent and a no-op once the schema is current.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # The single variable api/config.py reads. Render injects the managed
      # database's own connection string; nothing is committed. api/db.py
      # rewrites the scheme to postgresql+psycopg on the way through.
      - key: DATABASE_URL
        fromDatabase:
          name: byline-db
          property: connectionString
      # The web app's address, used to build the links in verification emails
      # (api/verifications.py). Render asks for it when the Blueprint is
      # created, because it is only known once byline-web exists.
      - key: SITE_URL
        sync: false
      # The same web address, used for the links in password-reset emails
      # (api/reset_mail.py). Also asked for when the Blueprint is created.
      - key: RESET_WEB_BASE_URL
        sync: false

  # --- React client ---------------------------------------------------------
  - type: web
    name: byline-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # SCRUM-13: the client calls /api on its own origin and Render forwards
      # it to the API. Same origin means the SameSite session cookie is sent
      # and no CORS is needed. Must stay above the catch-all below. If the API
      # service is recreated under a new URL, update this destination.
      - type: rewrite
        source: /api/*
        destination: https://byline-api-mn90.onrender.com/*
      # React Router handles routing in the browser, so every path that is not
      # a real file has to be served index.html.
      - type: rewrite
        source: /*
        destination: /index.html
